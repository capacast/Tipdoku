<style>
:root{--bg1:#f8f6f1;--bg2:#ebe6db;--fg:#16161a;--mut:#6d6b73;--card:#fff;--line:#e3dfd4;--ink:#16161a;--acc1:#7b2cbf;--acc2:#4361ee;--cc:#26307f;--ct:#fff;--dc:#5a2d9c;--dt:#fff;--sh:0 2px 8px rgba(30,30,60,.09);--fd:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#101015;--bg2:#1b1b26;--fg:#f1f0f5;--mut:#9b99a6;--card:#1f1f2b;--line:#2f2f40;--ink:#f1f0f5;--acc1:#9b6bff;--acc2:#5b7cff;--cc:#5a6ee0;--ct:#fff;--dc:#a56bf0;--dt:#fff;--sh:0 2px 10px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg1:#101015;--bg2:#1b1b26;--fg:#f1f0f5;--mut:#9b99a6;--card:#1f1f2b;--line:#2f2f40;--ink:#f1f0f5;--acc1:#9b6bff;--acc2:#5b7cff;--cc:#5a6ee0;--ct:#fff;--dc:#a56bf0;--dt:#fff;--sh:0 2px 10px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--fg);font:15px/1.3 var(--fb);touch-action:manipulation;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:6px 12px 8px;transform:scale(var(--k,1));transform-origin:top center;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#hdr{--lw:clamp(13px,calc((min(100vw,440px) - 108px)/14 - 2.2px),24px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;height:40px}.hr{display:flex;gap:8px;justify-self:end}.hlogo{justify-self:start;display:flex;gap:1px;background:none;border:0;padding:0;cursor:pointer}.ht{display:flex;align-items:center;justify-content:center;width:var(--lw);height:calc(var(--lw)*1.28);border-radius:calc(var(--lw)*.28);background:var(--c);color:#fff;font:800 calc(var(--lw)*.78)/1 var(--fd);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.2)}
h1{font:800 24px/1 var(--fd);margin:0;letter-spacing:.1em;flex:1;background:linear-gradient(90deg,#ED1C24 0%,#FFB400 33%,#22B14C 66%,#00A2E8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#tm{font:700 20px/1 var(--fd);font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:99px;padding:6px 12px;min-width:68px;text-align:center}
.q{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);color:var(--fg);font:700 15px var(--fd);cursor:pointer;padding:0}
#lv{color:var(--mut);font-size:12px;height:16px;display:flex;justify-content:space-between;gap:8px;margin-top:2px}#lv span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#lv .sc{font:700 12px var(--fd);color:var(--fg);letter-spacing:.06em}
#wrap{position:relative;margin:6px 0 4px}#in{transition:filter .25s}#in.hide{filter:blur(12px);pointer-events:none}
#g{display:grid;grid-template-columns:32px repeat(3,var(--s)) 32px;grid-template-rows:32px repeat(4,var(--s));gap:0;justify-content:center}
.l{display:flex;align-items:center;justify-content:center;}.bw{display:inline-block;vertical-align:middle;filter:drop-shadow(0 0 1px rgba(0,0,0,.75))}.bc,.bd{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;line-height:1;vertical-align:middle}
.bc{width:30px;height:30px;padding-bottom:7px;background:var(--cc);color:var(--ct);font-size:16px;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.bd{width:30px;height:30px;padding-right:7px;background:var(--dc);color:var(--dt);font-size:16px;clip-path:polygon(0 0,58% 0,100% 50%,58% 100%,0 100%)}
.sm.bc{width:22px;height:22px;padding-bottom:5px;font-size:12px;margin:0 2px}.sm.bd{width:22px;height:22px;padding-right:5px;font-size:12px;margin:0 2px}
.zb{pointer-events:none;z-index:0}
.c{margin:4px;border:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:calc(var(--s)*.5);font-weight:700;cursor:pointer;position:relative;z-index:1;user-select:none;transition:transform .12s}
.c.fix{cursor:default}.c.fix::after{content:"";position:absolute;inset:6px;border:1.5px solid currentColor;border-radius:3px;opacity:.3}
.c.sel{z-index:2;box-shadow:0 0 0 2px var(--bg1),0 0 0 5px var(--ink)}.c.bad{box-shadow:inset 0 0 0 4px #e0002f}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px;line-height:1.4}#ov.off{display:none}
.b{font:600 15px var(--fb);border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);color:var(--fg);border-radius:14px;padding:8px 12px;cursor:pointer;min-height:44px}
.b.p{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border:0;font-weight:700;font-size:16px;letter-spacing:.03em}.b.on{background:var(--ink);color:var(--bg1);border-color:var(--ink)}
.row{display:flex;gap:8px;width:100%}.row .b{flex:1;padding:8px 4px}
#cl{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
#cl li{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:14px;padding:5px 8px;font-size:14.5px;font-weight:500;line-height:1.25;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px}#cl li.d{text-decoration:line-through;opacity:.4}#cl li b{font-family:var(--fd);font-weight:700;font-size:1.08em}
.xb{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;background:#e11d48;border:2px solid #fff;color:#fff;font:700 15px/1 var(--fb);display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 6px #0007;cursor:pointer}
.z{display:inline-block;padding:0 8px;border-radius:99px;font-size:12.5px;font-weight:700;margin:0 2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#msg{height:24px;margin:4px 0 2px;font-weight:700;text-align:center;font-size:14px}
#pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#pad button{font:600 20px var(--fd);border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);color:var(--fg);border-radius:14px;height:42px;cursor:pointer;padding:0}#pad button.u{opacity:.25;box-shadow:none}
#act{display:flex;gap:8px;margin-top:auto;padding-top:16px}#act .b{flex:1;min-height:40px;padding:6px}
#help,#opt{position:fixed;inset:0;background:#0009;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}#help.on,#opt.on{display:flex}
#help>div,#opt>div{transform:scale(var(--k,1));max-height:calc(88vh/var(--k,1));max-height:calc(88dvh/var(--k,1));overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px;padding:18px;max-width:380px;font-size:14px;box-shadow:0 10px 40px #0006}#help b,#opt b{display:block;margin:10px 0 2px;font-family:var(--fd);font-size:15px}

<script>
const TG=(()=>{
const N=12,ZS="RRYRYYGBBGGB",ZL=["R","Y","G","B"],ALL=(1<<N)-1;

function prop(dom,clues){
 let ch=true;const setd=(n,v)=>{if(v!==dom[n]){dom[n]=v;ch=true}};
 while(ch){ch=false;const cmin=Array(N).fill(99),cmax=Array(N).fill(0);
  for(let n=1;n<=N;n++){if(!dom[n])return false;for(const c of bitsOf(dom[n])){if(n<cmin[c])cmin[c]=n;if(n>cmax[c])cmax[c]=n}}
  for(const cl of clues){const t=cl[0],a=cl[1];
   if(t=="SUM"){const gc=GR[a],tg=cl[2];const cc=gc.map(c=>{const l=[];for(let n=1;n<=N;n++)if(dom[n]>>c&1)l.push(n);return l});const sup=new Set(),asg=[];
    const rec=(k,tot,used)=>{if(k==gc.length){if(tot==tg)gc.forEach((c,i)=>sup.add(c*16+asg[i]));return}for(const n of cc[k])if(!(used>>n&1)&&tot+n<=tg){asg[k]=n;rec(k+1,tot+n,used|1<<n)}};

   else if(t=="SGT"){const A=GR[a],Bg=GR[cl[2]];let minB=0,maxA=0;for(const c of Bg)minB+=cmin[c];for(const c of A)maxA+=cmax[c];if(maxA<=minB)return false;

    for(const c of Bg){const o=minB-cmin[c];for(let n=1;n<=N;n++)if((dom[n]>>c&1)&&n+o>maxA-1){dom[n]&=~bit(c);ch=true}}}
   else if(t=="NH"){const x=a,tb={R:rR,L:rL,U:rU,D:rB}[cl[2]],hi=cl[3]=="hi",good=d=>hi?cmax[d]>x:cmin[d]<x,ds=c=>bitsOf(tb?tb[c]:nbm[c]);let al=0;
